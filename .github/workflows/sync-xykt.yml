# 每天自动同步 xykt 的测试脚本：去广告 → 校验 → 有变化才提交
# 校验失败时不更新（用户继续用上一个干净版本），并开一个 Issue 提醒
name: Sync xykt scripts

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 UTC 03:17（北京时间 11:17）
  push:                    # 改了配置（域名、仓库）或去广告规则时立即重新生成
    branches: [main]
    paths: [CaoCong.sh, xykt/patch.sh, xykt/sync.sh]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Sync and patch
        run: bash xykt/sync.sh

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xykt/
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "同步 xykt 测试脚本：$(tr '\n' ' ' < xykt/VERSIONS)"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="xykt 脚本同步失败，需要检查去广告规则"
          if ! gh issue list --state open --search "$title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body "自动同步在去广告校验时失败，用户仍在使用上一个干净版本。运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
